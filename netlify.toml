# Netlify: static web app (dist/) + the API as one serverless function.
# Data lives in Turso; set TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, JWT_SECRET
# (and SALONY_ENV=production) in Site settings → Environment variables.
[build]
  command = "npm ci && npx expo export --platform web && cd backend && npm ci --omit=dev"
  publish = "dist"
  functions = "backend/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["libsql"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/_expo/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
